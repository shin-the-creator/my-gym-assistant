# 안드로이드 설치 파일(APK)을 GitHub 서버에서 만든다.
# 결과물은 "android-latest" 릴리스에 my-gym-trainer.apk 로 올라가므로
# 휴대폰 브라우저에서 바로 내려받아 설치할 수 있다(컴퓨터 불필요).
name: Android APK

on:
  push:
    branches: [main, claude/healthcare-trainer-app-e2l5g2]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 앱이 받는 Gemma 모델 주소가 로그인 없이 열리는지 확인(빌드와 별개, 실패해도 빌드는 진행)
  model-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check Gemma GGUF download links
        run: |
          for url in \
            "https://huggingface.co/ggml-org/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf" \
            "https://huggingface.co/unsloth/gemma-3-1b-it-GGUF/resolve/main/gemma-3-1b-it-Q4_K_M.gguf" \
            "https://huggingface.co/ggml-org/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf" \
            "https://huggingface.co/unsloth/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf"; do
            out=$(curl -sIL -o /dev/null -w "%{http_code} %{size_download} %{url_effective}" --max-time 30 -r 0-0 "$url" || true)
            len=$(curl -sIL --max-time 30 "$url" | grep -i '^content-length' | tail -1 | tr -d '\r' || true)
            echo "MODEL_LINK $url -> $out | $len"
          done

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npx tsc --noEmit
          npx jest

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64, 삼성 등 최신 안드로이드폰)
        working-directory: android
        env:
          # 저장소 Settings → Secrets 에 GEMINI_API_KEY 를 넣어 두면 앱에 키가 들어간다(없으면 앱 설정에서 입력)
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NODE_ENV: production
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk my-gym-trainer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-gym-trainer-apk
          path: my-gym-trainer.apk

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest my-gym-trainer.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "My Gym Trainer (Android)" \
            --notes "브랜치 ${GITHUB_REF_NAME} · 커밋 ${GITHUB_SHA::7} 빌드. 휴대폰에서 my-gym-trainer.apk 를 눌러 내려받아 설치하세요."
